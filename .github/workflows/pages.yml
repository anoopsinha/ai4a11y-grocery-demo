# Publishes the store as a static site on GitHub Pages: the files in public/
# plus the product snapshot. Nothing runs on a server; the cart stays in the
# visitor's browser.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check that every meal can be shopped
        run: npm test
      - name: Assemble the site
        run: |
          mkdir _site
          cp -R public/. _site/
          cp data/products.json _site/products.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
